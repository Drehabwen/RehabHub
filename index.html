<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- 移动端优化视口设置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="DeepRehab 视频分析系统 - 专业的康复动作评估工具，基于AI技术的康复评估平台" />
    <meta name="keywords" content="康复评估,动作分析,FMS,姿态识别,医疗AI,康复治疗" />
    <meta name="author" content="DeepRehab团队" />
    <!-- PWA支持 -->
    <meta name="theme-color" content="#4f7a9d" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Apple设备支持 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DeepRehab" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Open Graph协议 -->
    <meta property="og:title" content="DeepRehab 视频分析系统" />
    <meta property="og:description" content="专业的康复动作评估工具，基于AI技术的康复评估平台" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <title>DeepRehab 视频分析系统</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background-color: #f5f7f5;
        color: #2d3a2d;
        /* 防止移动端橡皮筋效果 */
        overscroll-behavior: none;
        /* 优化触摸滚动 */
        -webkit-overflow-scrolling: touch;
        /* 禁用文本选择和长按菜单 */
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        /* 优化点击延迟 */
        touch-action: manipulation;
      }
      
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100%;
        background-color: #f5f7f5;
      }
      
      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(143, 170, 143, 0.3);
        border-top: 5px solid #8faa8f;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loading-text {
        font-size: 18px;
        color: #5a6b5a;
        text-align: center;
        /* 添加加载动画 */
        animation: pulse 1.5s ease-in-out infinite alternate;
      }
      
      @keyframes pulse {
        from {
          opacity: 0.6;
        }
        to {
          opacity: 1;
        }
      }
      
      .error-container {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100%;
        background-color: #f5f7f5;
        padding: 20px;
        text-align: center;
      }
      
      .error-title {
        font-size: 24px;
        color: #d48a8a;
        margin-bottom: 15px;
      }
      
      .error-message {
        font-size: 16px;
        color: #5a6b5a;
        margin-bottom: 20px;
        max-width: 500px;
        line-height: 1.5;
      }
      
      .retry-button {
        background-color: #8faa8f;
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      
      .retry-button:hover {
        background-color: #a8c4a8;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-container" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">正在加载 DeepRehab 视频分析系统...</div>
      </div>
      <div class="error-container" id="error">
        <div class="error-title">加载失败</div>
        <div class="error-message" id="error-message">无法加载应用程序，请检查网络连接后重试。</div>
        <button class="retry-button" onclick="retryLoad()">重试</button>
      </div>
    </div>
    
    <!-- 添加process polyfill以解决"process is not defined"错误 -->
    <script>
      // 在应用加载前提供基本的process polyfill
      if (typeof window.process === 'undefined') {
        window.process = {
          env: {
            NODE_ENV: 'production'
          }
        };
      }
      
      // 错误处理函数
      function retryLoad() {
        document.getElementById('error').style.display = 'none';
        document.getElementById('loading').style.display = 'flex';
        location.reload();
      }
      
      // 监听加载错误
      window.addEventListener('error', function(e) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'flex';
        if (e.error) {
          document.getElementById('error-message').textContent = '加载应用程序时发生错误: ' + e.error.message;
        }
      });
    </script>
    
    <!-- 添加Service Worker支持，用于PWA功能 -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
